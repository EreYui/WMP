[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["source/wmp_go2"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["WMP", "legged_mpc_amp", "source/wmp_go2/wmp_go2/assets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
